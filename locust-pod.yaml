apiVersion: v1
kind: Pod
metadata:
  name: locust
spec:
  containers:
    - name: locust
      image: locustio/locust:2.46.4
      args:
        - "-f"
        - "/mnt/locust/locustfile_stable.py"
        - "--host=http://php-apache"
        - "--web-host=0.0.0.0"
      ports:
        - containerPort: 8089
      volumeMounts:
        - name: locust-file
          mountPath: /mnt/locust
  volumes:
    - name: locust-file
      configMap:
        name: locust-stable-file
